<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juris Consultants USA — Final Dashboards (Customer + Admin)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!--
 FINAL DASHBOARD DESIGN (approved: Design 7 "Analytics Pro").
 One file, two views: Customer portal (#customer) and Admin panel (#admin).
 The yellow "PREVIEW" switch in the top bar exists ONLY to switch views in this file. It is NOT part of the product.
 All numbers, names and orders are SAMPLE data.
-->
<style>
:root{
 --bg:#05070D;--bg2:#0A0E1A;--solid:#0D1324;--card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.065);
 --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.16);
 --tx:#F1F5F9;--body:#CBD5E1;--mu:#94A3B8;--mu2:#64748B;
 --blue:#3B82F6;--blue2:#93C5FD;--cyan:#22D3EE;--cyan2:#67E8F9;--acc:#7DD3FC;--violet:#8B5CF6;--pink:#E879F9;
 --ok:#34D399;--warn:#FBBF24;--bad:#F87171;
 --grad:linear-gradient(135deg,#3B82F6,#22D3EE);--btn:linear-gradient(135deg,#2563EB,#0891B2);
 --r:18px;--rb:12px;
 --h:'Sora',Inter,system-ui,sans-serif;--f:'Inter',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--body);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,h4{font-family:var(--h);color:var(--tx);font-weight:700;letter-spacing:-.01em}
svg{display:block}
.mono{font-family:var(--m)}
/* ---------- shell ---------- */
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;background:
 radial-gradient(900px 500px at 85% -10%,rgba(59,130,246,.16),transparent 60%),
 radial-gradient(700px 500px at -10% 110%,rgba(34,211,238,.10),transparent 60%)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(180deg,rgba(0,0,0,.6),transparent 70%)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 16px 18px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(13,19,36,.85),rgba(5,7,13,.9));backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font:700 17px var(--h);color:var(--tx)}
.brand .lg{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font:800 13px var(--h);box-shadow:0 8px 24px rgba(59,130,246,.35)}
.brand b{color:var(--blue)}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--mu);font-weight:500;transition:.2s;position:relative}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{color:var(--tx);background:var(--card)}
.nav a.on{color:var(--tx);background:linear-gradient(90deg,rgba(59,130,246,.22),rgba(59,130,246,.04));box-shadow:inset 0 0 0 1px rgba(59,130,246,.35)}
.nav a.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 14px var(--cyan)}
.nav a .pill{margin-left:auto;font:600 11px var(--f);padding:2px 8px;border-radius:20px;background:rgba(251,191,36,.15);color:var(--warn)}
.nav .sec{font:600 10.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--mu2);padding:16px 14px 6px}
.side .grow{flex:1}
.newo{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:14px;background:var(--btn);color:#fff;font-weight:600;box-shadow:0 10px 30px rgba(37,99,235,.35)}
.newo svg{width:18px;height:18px}
.helpc{margin-top:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--mu)}
.helpc b{display:block;color:var(--tx);font:600 13px var(--f);margin-bottom:4px}
.helpc a{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--ok);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:16px 34px;border-bottom:1px solid var(--line);background:rgba(5,7,13,.72);backdrop-filter:blur(14px)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mu2)}
.search svg{width:17px;height:17px}
.top .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--body);position:relative}
.ib svg{width:18px;height:18px}
.ib .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.user{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:40px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-weight:600}
.av{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font:700 14px var(--h)}
.user svg{width:14px;height:14px;color:var(--mu)}
#view{padding:30px 34px 120px;max-width:1500px;width:100%}
/* ---------- common ---------- */
.card{position:relative;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));padding:22px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;overflow:hidden}
.card:hover{transform:translateY(-4px);border-color:rgba(59,130,246,.45);box-shadow:0 22px 50px rgba(59,130,246,.18)}
.card.nh:hover{transform:none;box-shadow:none;border-color:var(--line)}
.ct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.ct h3{font-size:15.5px}
.ct .lnk{font-size:12.5px;color:var(--blue2);font-weight:600;white-space:nowrap}
.eyebrow{font:600 11px var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.g{display:grid;gap:18px}
.row{display:flex;align-items:center;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font:600 11.5px var(--f);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.c-ok{color:var(--ok);background:rgba(52,211,153,.12)}.c-warn{color:var(--warn);background:rgba(251,191,36,.12)}.c-blue{color:var(--acc);background:rgba(59,130,246,.15)}.c-mu{color:var(--mu);background:rgba(148,163,184,.12)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:var(--rb);background:var(--btn);color:#fff;font-weight:600;box-shadow:0 10px 26px rgba(37,99,235,.3);transition:.25s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(34,211,238,.35)}
.btn.gh{background:var(--card);border:1px solid var(--line2);box-shadow:none;color:var(--tx)}
.btn svg{width:16px;height:16px}
.big{font:700 30px var(--h);color:var(--tx);letter-spacing:-.02em}
.sm{font-size:12.5px;color:var(--mu)}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.hello h1{font-size:28px}
.hello p{color:var(--mu);margin-top:4px}
.kpi .lab{font-size:12.5px;color:var(--mu);display:flex;align-items:center;gap:8px}
.kpi .lab i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(59,130,246,.14);color:var(--acc)}
.kpi .lab i svg{width:16px;height:16px}
.kpi .val{font:700 30px var(--h);color:var(--tx);margin:12px 0 2px;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--ok)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font:600 11px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mu2);padding:0 10px 10px}
.tbl td{padding:13px 10px;border-top:1px solid var(--line);color:var(--body);font-size:13.5px;vertical-align:middle}
.tbl td b{color:var(--tx);font-weight:600}
.dl{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);color:var(--acc)}
.dl svg{width:15px;height:15px}
.dl.lock{color:var(--mu2)}
.fi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(59,130,246,.12);color:var(--acc);flex:none}
.fi svg{width:17px;height:17px}
.list>div{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0;padding-top:0}
.list .t{flex:1;min-width:0}.list .t b{display:block;color:var(--tx);font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list .t small{color:var(--mu);font-size:12px}
.act{border-color:rgba(251,191,36,.35);background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(251,191,36,.02))}
.act .ic{width:44px;height:44px;border-radius:12px;background:rgba(251,191,36,.18);color:var(--warn);display:grid;place-items:center;flex:none}
.act .ic svg{width:22px;height:22px}
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:8px;background:var(--grad);box-shadow:0 0 14px rgba(34,211,238,.6);width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
/* stepper */
.stp{display:flex;align-items:flex-start;position:relative;margin:6px 0 4px}
.stp .s{flex:1;text-align:center;position:relative;z-index:1}
.stp .s .o{width:30px;height:30px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:var(--solid);color:var(--mu2);font:700 12px var(--h);transition:.4s}
.stp .s .o svg{width:14px;height:14px}
.stp .s.d .o{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.stp .s.c .o{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 6px rgba(34,211,238,.12),0 0 24px rgba(34,211,238,.6);animation:pulse 2s infinite}
.stp .s b{display:block;font:600 12px var(--f);color:var(--body)}
.stp .s small{font-size:11px;color:var(--mu2)}
.stp .s.c b{color:var(--cyan2)}
.stp .ln{position:absolute;left:calc(100%/14);right:calc(100%/14);top:14px;height:2px;background:var(--line2)}
.stp .ln i{display:block;height:100%;background:var(--grad);box-shadow:0 0 10px var(--cyan);width:0;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(34,211,238,.04),0 0 30px rgba(34,211,238,.8)}}
/* vertical timeline */
.vt{position:relative;padding-left:30px}
.vt::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.vt .e{position:relative;padding-bottom:20px}
.vt .e:last-child{padding-bottom:0}
.vt .e::before{content:"";position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--solid);border:2px solid var(--line2)}
.vt .e.d::before{background:var(--grad);border-color:transparent;box-shadow:0 0 12px rgba(34,211,238,.6)}
.vt .e.c::before{border-color:var(--cyan);box-shadow:0 0 0 5px rgba(34,211,238,.15),0 0 16px var(--cyan);animation:pulse 2s infinite}
.vt .e b{display:block;color:var(--tx);font-weight:600;font-size:13.5px}
.vt .e.u b{color:var(--mu)}
.vt .e small{color:var(--mu);font-size:12px}
.vt .e .when{float:right;font-size:12px;color:var(--mu2)}
/* animations */
.rv{opacity:0;transform:translateY(14px);animation:rv .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rv{to{opacity:1;transform:none}}
.draw{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.grow-b{transform-origin:bottom;transform:scaleY(0);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.fadein{opacity:0;transition:opacity .8s .8s}
/* sample badge */
.sample{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;border:1px dashed rgba(251,191,36,.45);color:var(--warn);font:600 11.5px var(--f)}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);opacity:0;z-index:60;padding:12px 18px;border-radius:12px;background:#0D1324;border:1px solid var(--line2);color:var(--tx);transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- per design ---------- */
/* D7 analytics */
.gt{border:0;color:#fff;padding:22px}
.gt .lab{color:rgba(255,255,255,.82)}
.gt.a{background:linear-gradient(135deg,#7C3AED,#3B82F6)}.gt.b{background:linear-gradient(135deg,#0891B2,#22D3EE)}.gt.c{background:linear-gradient(135deg,#2563EB,#6366F1)}.gt.d{background:linear-gradient(135deg,#0F766E,#34D399)}
.gt .val{color:#fff}
.gt::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.legend{display:grid;gap:10px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{margin-left:auto;color:var(--tx)}
/* responsive */
@media (max-width:1200px){.cols-4{grid-template-columns:repeat(2,1fr)!important}.cols-3{grid-template-columns:1fr 1fr!important}}
@media (max-width:900px){
 .app,.app.rail{grid-template-columns:1fr}
 .side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;z-index:20;padding:8px;border-right:0;border-top:1px solid var(--line)}
 .side .brand,.side .nav .sec,.side .grow,.side .helpc,.side .newo{display:none}
 .side .nav{display:flex;flex:1;justify-content:space-around}
 .nav a{flex-direction:column;gap:2px;padding:6px;font-size:11px}.nav a .pill{display:none}.nav a.on::before{display:none}
 .top{padding:12px 16px}.search,.user span{display:none}
 #view{padding:20px 16px 170px}
 [class*="cols-"]{grid-template-columns:1fr!important}
 .stp .s small{display:none}.stp .s b{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
/* ===== attractive sidebar (v2) ===== */
.app{grid-template-columns:280px 1fr}
.side{padding:22px 16px 16px;gap:2px;overflow-y:auto;background:linear-gradient(180deg,rgba(17,22,44,.92),rgba(7,9,18,.95))}
.side::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px 200px at 0% 0%,rgba(124,58,237,.18),transparent 70%),radial-gradient(260px 220px at 100% 100%,rgba(34,211,238,.10),transparent 70%)}
.brand{position:relative;padding:0 8px 18px}
.brand small{display:block;font:600 10px var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--mu2);margin-top:2px}
.nav{position:relative}
.nav .sec{display:flex;align-items:center;gap:8px;font:700 10px var(--f);letter-spacing:.18em;padding:18px 12px 8px;color:#7C8BA5}
.nav .sec::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--sc,#8B5CF6);box-shadow:0 0 8px var(--sc,#8B5CF6)}
.nav a{gap:12px;padding:6px 10px;margin:1px 0;border-radius:14px;color:#A7B4C8;border:1px solid transparent}
.nav a .it{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);transition:.25s}
.nav a .it svg{width:17px;height:17px}
.nav a span{transition:transform .25s}
.nav a:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.nav a:hover .it{border-color:rgba(139,92,246,.5);color:#C4B5FD;transform:scale(1.06)}
.nav a:hover span{transform:translateX(2px)}
.nav a.on{color:#fff;background:linear-gradient(90deg,rgba(124,58,237,.34),rgba(59,130,246,.18) 70%,rgba(59,130,246,.04));border-color:rgba(139,92,246,.45);box-shadow:0 10px 30px rgba(124,58,237,.18),inset 0 1px 0 rgba(255,255,255,.08)}
.nav a.on .it{background:linear-gradient(135deg,#7C3AED,#3B82F6);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.5)}
.nav a.on::before{left:-16px;top:8px;bottom:8px;width:4px;background:linear-gradient(180deg,#A78BFA,#22D3EE);box-shadow:0 0 16px #A78BFA}
.nav a.on::after{content:"";position:absolute;right:12px;width:7px;height:7px;border-top:2px solid #C4B5FD;border-right:2px solid #C4B5FD;transform:rotate(45deg)}
.nav a .pill{margin-left:auto;margin-right:0;font:700 10.5px var(--f);padding:2px 8px;border-radius:20px;background:linear-gradient(135deg,#7C3AED,#3B82F6);color:#fff;box-shadow:0 0 12px rgba(124,58,237,.5)}
.nav a .pill.w{background:rgba(251,191,36,.16);color:var(--warn);box-shadow:none}
.nav a.on .pill{margin-right:16px}
.promo{position:relative;margin-top:14px;padding:16px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#7C3AED,#2563EB 55%,#0891B2);color:#fff;box-shadow:0 16px 40px rgba(37,99,235,.35)}
.promo::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.promo b{display:block;font:700 14px var(--h);margin-bottom:4px}
.promo p{font-size:12px;opacity:.85}
.promo a{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.18);font-weight:600;font-size:12.5px;backdrop-filter:blur(6px)}
.promo a svg{width:14px;height:14px}
.promo .pi{position:absolute;right:12px;bottom:10px;width:46px;height:46px;opacity:.35;transform:rotate(-12deg)}
.ucard{position:relative;display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.ucard .av{width:36px;height:36px}
.ucard b{display:block;color:var(--tx);font-size:13px}
.ucard small{color:var(--mu);font-size:11.5px}
.ucard .lo{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mu);border:1px solid var(--line)}
.ucard .lo svg{width:15px;height:15px}
.sysok{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ok);margin-top:6px}
.sysok i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
/* top bar */
.crumb{font-size:13px;color:var(--mu)}.crumb b{color:var(--tx);font-weight:600}
.vsw{display:flex;padding:4px;border-radius:12px;border:1px dashed rgba(251,191,36,.45);background:rgba(251,191,36,.05);gap:4px;align-items:center}
.vsw em{font:700 9.5px var(--f);letter-spacing:.14em;color:var(--warn);font-style:normal;padding:0 6px}
.vsw button{padding:7px 12px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--mu)}
.vsw button.on{background:linear-gradient(135deg,#7C3AED,#3B82F6);color:#fff}
/* admin bits */
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font:600 11.5px var(--f);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.funnel>div{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;margin-bottom:12px;font-size:13px}
.funnel .bar{height:30px;border-radius:9px;background:rgba(255,255,255,.05);overflow:hidden}
.funnel .bar i{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;height:100%;border-radius:9px;color:#fff;font:700 12px var(--f);width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.funnel b{color:var(--tx)}
.tg{position:relative;width:40px;height:22px;border-radius:22px;background:rgba(255,255,255,.12);transition:.25s;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}
.tg.on{background:linear-gradient(135deg,#10B981,#22D3EE);box-shadow:0 0 12px rgba(34,211,238,.45)}
.tg.on::after{left:21px}
.att>div{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);margin-bottom:10px}
.att .n{font:800 22px var(--h);color:var(--tx);min-width:34px;text-align:center}
.att .t{flex:1}.att .t b{display:block;color:var(--tx);font-size:13.5px}.att .t small{color:var(--mu);font-size:12px}
.sbtn{padding:7px 12px;border-radius:9px;font-weight:600;font-size:12px;background:rgba(124,58,237,.18);color:#C4B5FD;border:1px solid rgba(139,92,246,.4);white-space:nowrap}
.flag{display:inline-block;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.07);font:700 10px var(--m);color:var(--mu);margin-left:6px}
@media (max-width:900px){.vsw em,.crumb{display:none}.funnel>div{grid-template-columns:100px 1fr 50px}.nav a .it{width:28px;height:28px}.nav a.on::after{display:none}.promo,.ucard{display:none}}
</style>

<body>
<div class="bgfx"></div>
<div class="app" id="app">
 <aside class="side">

  <nav class="nav" id="nav"></nav>
  <div class="grow"></div>

 </aside>
 <div class="main">

   <div class="crumb" id="crumb"></div>

   <div class="sp"></div>

   <span class="sample">Sample data</span>
   <button class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="dot"></span></button>
   <div class="user"><div class="av" id="tav">R</div><span id="tname">Ritikesh</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></div>
  </header>
  <main id="view"></main>
 </div>
</div>
<div class="toast" id="toast"></div>
<script>

/* ================= icons ================= */
const P={
 dash:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
 orders:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
 docs:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
 pay:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
 check:'<path d="m5 12 5 5L20 7"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 down:'<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>',
 alert:'<path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>',
 bank:'<path d="M3 10h18L12 3zM5 10v8M9 10v8M15 10v8M19 10v8M3 21h18"/>',
 arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',
 upload:'<path d="M12 21V9m0 0-4 4m4-4 4 4M4 3h16"/>',
 spark:'<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>',
 build:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>'
};
const I=(n,c='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${c}>${P[n]}</svg>`;
/* ================= sample data (illustrative) ================= */
const STG=['Paid','Your details','Expert review','Filed with state','State approved','EIN received','Completed'];
const STD=['02 Nov','03 Nov','04 Nov','05 Nov','~10 Nov','~24 Nov','~26 Nov'];
const O=[
 {id:'JC-1042',svc:'US LLC Formation',co:'Nova Labs LLC',st:'Wyoming',stage:3,amt:349,date:'02 Nov 2026',ico:'build'},
 {id:'JC-1043',svc:'EIN & Tax ID',co:'Nova Labs LLC',st:'IRS',stage:1,amt:79,date:'03 Nov 2026',ico:'shield',action:'Upload passport for KYC'},
 {id:'JC-1044',svc:'Registered Agent',co:'Nova Labs LLC',st:'Wyoming',stage:6,amt:99,date:'02 Nov 2026',ico:'cal',active:'Active · renews 02 Nov 2027'},
 {id:'JC-0988',svc:'Talk to an Expert',co:'30-min consultation',st:'Online',stage:6,amt:49,date:'18 Oct 2026',ico:'chat'}
];
const PAY=[{d:'18 Oct',v:49,s:'Talk to an Expert'},{d:'02 Nov',v:349,s:'US LLC Formation'},{d:'02 Nov',v:99,s:'Registered Agent'},{d:'03 Nov',v:79,s:'EIN & Tax ID'}];
const DOCS=[
 {n:'Operating Agreement',o:'JC-1042',d:'05 Nov',ok:1},
 {n:'Registered Agent consent',o:'JC-1044',d:'02 Nov',ok:1},
 {n:'Invoice JC-1042',o:'JC-1042',d:'02 Nov',ok:1},
 {n:'Expert call summary',o:'JC-0988',d:'18 Oct',ok:1},
 {n:'Articles of Organization',o:'JC-1042',d:'After state approval',ok:0},
 {n:'EIN letter (CP 575)',o:'JC-1043',d:'After IRS approval',ok:0}
];
const DUE=[{n:'Federal tax filing (Form 5472 + 1120)',d:'15 Apr 2027',m:3,lvl:2},{n:'Wyoming annual report',d:'01 Nov 2027',m:10,lvl:2},{n:'Registered Agent renewal',d:'02 Nov 2027',m:10,lvl:1}];
const TOTAL=PAY.reduce((a,b)=>a+b.v,0);
const MAIN=O[0];const PCT=Math.round(MAIN.stage/(STG.length-1)*100);
/* ================= helpers ================= */
let gid=0;
const chip=o=>o.action?`<span class="chip c-warn">Action needed</span>`:o.stage>=6?`<span class="chip c-ok">${o.active?'Active':'Completed'}</span>`:`<span class="chip c-blue">${STG[o.stage]}</span>`;
const money=v=>'$'+v.toLocaleString('en-US');
function ring(p,size=150,sw=12,inner='',c1='#3B82F6',c2='#22D3EE'){const id='rg'+(++gid),r=(size-sw)/2,C=2*Math.PI*r;
 return `<div style="position:relative;width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><defs><linearGradient id="${id}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${sw}"/><circle class="draw" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C*(1-p/100)}" style="filter:drop-shadow(0 0 8px ${c2}88)"/></svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">${inner}</div></div>`}
function area(vals,labs,w=640,h=220,col='#22D3EE',pre='$'){const id='ar'+(++gid),pad=34,mx=Math.max(...vals)*1.2,X=i=>pad+i*(w-pad-10)/(vals.length-1),Y=v=>h-26-(v/mx)*(h-46);
 let d='';vals.forEach((v,i)=>{if(!i)d=`M${X(i)},${Y(v)}`;else{const x0=X(i-1),x1=X(i),cx=(x0+x1)/2;d+=` C${cx},${Y(vals[i-1])} ${cx},${Y(v)} ${x1},${Y(v)}`}});
 const grid=[0,.25,.5,.75,1].map(k=>`<line x1="${pad}" x2="${w-10}" y1="${Y(mx*k/1.2*1.0)}" y2="${Y(mx*k/1.2)}" stroke="rgba(255,255,255,.06)"/><text x="${pad-8}" y="${Y(mx*k/1.2)+4}" fill="#64748B" font-size="10" text-anchor="end">${pre}${Math.round(mx*k/1.2)}</text>`).join('');
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="overflow:visible"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${grid}<path class="fadein" d="${d} L${X(vals.length-1)},${h-26} L${X(0)},${h-26}Z" fill="url(#${id})"/><path class="draw" d="${d}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 0 6px ${col})" data-len="1"/>${vals.map((v,i)=>`<circle class="fadein" cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="#05070D" stroke="${col}" stroke-width="2.5"/><text x="${X(i)}" y="${h-6}" fill="#64748B" font-size="10.5" text-anchor="middle">${labs[i]}</text>`).join('')}</svg>`}
function donut(seg,size=170,sw=22,inner=''){let tot=seg.reduce((a,b)=>a+b.v,0),r=(size-sw)/2,C=2*Math.PI*r,off=0;
 const arcs=seg.map(s=>{const L=C*s.v/tot,el=`<circle class="draw" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${sw}" stroke-dasharray="${Math.max(L-3,1)} ${C}" stroke-dashoffset="${C}" data-to="${-off}" style="filter:drop-shadow(0 0 6px ${s.c}66)"/>`;off+=L;return el}).join('');
 return `<div style="position:relative;width:${size}px;height:${size}px;flex:none"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="${sw}"/>${arcs}</svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">${inner}</div></div>`}
function bars(vals,labs,w=420,h=200,c1='#3B82F6',c2='#22D3EE',pre=''){const id='br'+(++gid),mx=Math.max(...vals)*1.15,bw=(w-20)/vals.length*.46;
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible"><defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>${[.25,.5,.75,1].map(k=>`<line x1="0" x2="${w}" y1="${h-24-(h-40)*k}" y2="${h-24-(h-40)*k}" stroke="rgba(255,255,255,.05)"/>`).join('')}${vals.map((v,i)=>{const x=10+i*(w-20)/vals.length+((w-20)/vals.length-bw)/2,bh=(v/mx)*(h-40);return `<rect class="grow-b" x="${x}" y="${h-24-bh}" width="${bw}" height="${bh}" rx="6" fill="url(#${id})" style="transition-delay:${i*.08}s;transform-box:fill-box"/><text x="${x+bw/2}" y="${h-24-bh-7}" fill="#CBD5E1" font-size="11" text-anchor="middle" font-weight="600">${pre}${v}</text><text x="${x+bw/2}" y="${h-6}" fill="#64748B" font-size="10.5" text-anchor="middle">${labs[i]}</text>`}).join('')}</svg>`}
function spark(vals,col='#22D3EE',w=120,h=38){const mx=Math.max(...vals),mn=Math.min(...vals),X=i=>i*w/(vals.length-1),Y=v=>h-4-(v-mn)/(mx-mn||1)*(h-8);return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible"><path class="draw" d="${vals.map((v,i)=>(i?'L':'M')+X(i)+','+Y(v)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px ${col})"/></svg>`}
function stepper(stage){return `<div class="stp"><div class="ln"><i data-w="${stage/(STG.length-1)*100}"></i></div>${STG.map((s,i)=>`<div class="s ${i<stage?'d':i===stage?'c':''}"><div class="o">${i<stage?I('check'):i+1}</div><b>${s}</b><small>${STD[i]}</small></div>`).join('')}</div>`}
function vt(stage,full){const notes=['Payment received · Invoice ready','Business & owner details submitted','Checked by your CA/CS expert','Submitted to Wyoming Secretary of State','Usually 3–5 business days','IRS issues your EIN','All documents in your vault'];
 return `<div class="vt">${STG.map((s,i)=>`<div class="e ${i<stage?'d':i===stage?'c':'u'}"><span class="when">${STD[i]}</span><b>${s}${i===stage?' · in progress':''}</b><small>${notes[i]}</small></div>`).join('')}</div>`}
const kpis=[{l:'Active orders',v:2,i:'orders',s:[1,1,2,2,3,2,2],d:'1 needs your action'},{l:'Completed',v:2,i:'check',s:[0,1,1,1,1,2,2],d:'Expert call + Registered Agent'},{l:'Total paid',v:TOTAL,i:'pay',s:[0,49,49,398,497,576,576],d:'4 payments',m:1},{l:'Documents ready',v:4,i:'docs',s:[0,1,1,2,3,4,4],d:'2 more on the way'}];
const kpiCard=(k,i,extra='')=>`<div class="card kpi rv ${extra}" style="animation-delay:${i*.07}s"><div class="lab"><i>${I(k.i)}</i>${k.l}</div><div class="row" style="justify-content:space-between;align-items:flex-end"><div class="val" data-count="${k.v}" data-m="${k.m||0}">0</div>${spark(k.s)}</div><div class="d">${k.d}</div></div>`;
const actionCard=(d=0)=>`<div class="card act rv" style="animation-delay:${d}s"><div class="row" style="align-items:flex-start"><div class="ic">${I('alert')}</div><div style="flex:1"><div class="eyebrow" style="color:var(--warn)">Action needed</div><h3 style="font-size:17px;margin:4px 0 4px">Upload your passport for KYC</h3><p class="sm">Needed for your EIN application (JC-1043). Takes 2 minutes.</p><a class="btn" style="margin-top:14px" href="#">${I('upload')}Upload now</a></div></div></div>`;
const docsList=(n=5)=>`<div class="list">${DOCS.slice(0,n).map(d=>`<div><div class="fi">${I('docs')}</div><div class="t"><b>${d.n}</b><small>${d.o} · ${d.d}</small></div>${d.ok?`<a class="dl" href="#" title="Download">${I('down')}</a>`:`<span class="dl lock" title="Not ready yet">${I('lock')}</span>`}</div>`).join('')}</div>`;
const dueList=()=>`<div class="list">${DUE.map(d=>`<div><div class="fi" style="background:rgba(139,92,246,.14);color:#C4B5FD">${I('cal')}</div><div class="t"><b>${d.n}</b><small>Due ${d.d}</small></div><span class="chip c-mu">Reminder on</span></div>`).join('')}</div>`;
const ordersTable=()=>`<table class="tbl"><tr><th>Order</th><th>Service</th><th>Status</th><th>Progress</th><th style="text-align:right">Paid</th></tr>${O.map(o=>`<tr><td><b class="mono">${o.id}</b><br><small class="sm">${o.date}</small></td><td><b>${o.svc}</b><br><small class="sm">${o.co}</small></td><td>${chip(o)}</td><td style="min-width:140px"><div class="pbar"><i data-w="${o.stage/6*100}"></i></div><small class="sm">${o.active||(o.stage>=6?'Done':'Step '+(o.stage+1)+' of 7')}</small></td><td style="text-align:right"><b>${money(o.amt)}</b></td></tr>`).join('')}</table>`;
const hello=(sub,btn=1)=>`<div class="hello rv"><div><div class="eyebrow">Dashboard</div><h1 style="margin-top:6px">Good evening, Ritikesh</h1><p>${sub}</p></div>${btn?`<div class="row"><a class="btn gh" href="#">${I('chat')}Talk to my expert</a><a class="btn" href="#">${I('arrow')}Start a new order</a></div>`:''}</div>`;
const payDonut=()=>{const seg=[{v:349,c:'#3B82F6',n:'LLC Formation'},{v:99,c:'#22D3EE',n:'Registered Agent'},{v:79,c:'#8B5CF6',n:'EIN & Tax ID'},{v:49,c:'#E879F9',n:'Expert call'}];return `<div class="row" style="gap:22px;flex-wrap:wrap">${donut(seg,170,20,`<div><div class="sm">Total</div><div style="font:700 24px var(--h);color:var(--tx)">${money(TOTAL)}</div></div>`)}<div class="legend" style="flex:1;min-width:160px">${seg.map(s=>`<div><i style="background:${s.c}"></i>${s.n}<b>${money(s.v)}</b></div>`).join('')}</div></div>`};
/* ================= extra icons ================= */
Object.assign(P,{
 users:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-5-6.7"/>',
 kyc:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17a3.5 3.5 0 0 1 7 0M15 9h3M15 13h3"/>',
 map:'<path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3z"/><path d="M9 3v15M15 6v15"/>',
 mail:'<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/>',
 team:'<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/><path d="M19 8h3M20.5 6.5v3"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 chart:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-6"/>',
 inv:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',
 logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
 refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>'
});
/* ================= menus ================= */
const MENU={
 customer:[
  ['Overview','#8B5CF6',[['dash','Dashboard',1]]],
  ['My account','#22D3EE',[['orders','My Orders',0,'1','w'],['docs','Documents',0,'4'],['pay','Payments'],['user','Profile']]],
  ['Help','#34D399',[['chat','Talk to my expert']]]],
 admin:[
  ['Overview','#8B5CF6',[['dash','Dashboard',1],['chart','Reports']]],
  ['Operations','#22D3EE',[['orders','Orders',0,'63'],['kyc','KYC review',0,'5','w'],['users','Customers'],['docs','Documents']]],
  ['Finance','#34D399',[['pay','Payments'],['inv','Invoices']]],
  ['Settings','#F472B6',[['map','States on/off'],['mail','Email templates'],['team','Staff & roles'],['gear','Settings']]]]
};
function renderSide(v){
 const nav=MENU[v].map(g=>`<div class="sec" style="--sc:${g[1]}">${g[0]}</div>`+g[2].map(m=>`<a href="#" class="${m[2]?'on':''}" data-x="${m[0]}"><span class="it">${I(m[0])}</span><span>${m[1]}</span>${m[3]?`<em class="pill ${m[4]||''}">${m[3]}</em>`:''}</a>`).join('')).join('');
 document.getElementById('nav').innerHTML=nav;
 document.getElementById('brandsub').textContent=v==='admin'?'Admin panel':'Customer portal';
 document.getElementById('sidefoot').innerHTML=v==='admin'
  ?`<div class="ucard"><div class="av">A</div><div><b>Amit</b><small>Super Admin · MFA on</small></div><a class="lo" href="#" title="Log out">${I('logout')}</a></div><div class="sysok"><i></i>All systems running</div>`

function anim(root){
 root.querySelectorAll('.draw').forEach(p=>{if(p.dataset.len){const L=p.getTotalLength?p.getTotalLength():1000;p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.dataset.to=0}});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  root.querySelectorAll('.draw').forEach(p=>{p.style.strokeDashoffset=p.dataset.to});
  root.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');
  root.querySelectorAll('.grow-b').forEach(e=>e.style.transform='scaleY(1)');
  root.querySelectorAll('.fadein').forEach(e=>e.style.opacity=1);
 }));
 root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,m=el.dataset.m==1,suf=el.dataset.suf||'',t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1300),e=1-Math.pow(1-k,3),v=Math.round(to*e);el.textContent=(m?'$':'')+v.toLocaleString('en-US')+suf;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
}
